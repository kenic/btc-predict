# Publish committed healthy-feed observations even when another feed fails.
[Service]
ReadWritePaths=/opt/btc-phase8a/inputs
ExecStartPost=
ExecStopPost=/usr/bin/python3 /opt/btc-phase8a/deploy/export_readonly_archive.py --source /opt/btc-news/news.db --destination /opt/btc-phase8a/inputs/news.db --kind news
