# /etc/systemd/system/btc-news.service.d/phase8a-export.conf
# Only the new dedicated output directory is added to existing collector permissions.
[Service]
ReadWritePaths=/opt/btc-phase8a/inputs
ExecStartPost=/usr/bin/python3 /opt/btc-phase8a/deploy/export_readonly_archive.py --source /opt/btc-news/news.db --destination /opt/btc-phase8a/inputs/news.db --kind news
